name: optibus-rag

x-backend-env: &backend-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  TOP_K: ${TOP_K:-5}
  REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:8.0.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build:
      context: ./backend
    command: ["python", "-m", "app.ingest", "--source", "dataset/documents.json", "--prune"]
    environment: *backend-env
    volumes:
      - ./backend/dataset:/app/dataset:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
